name: Windows portable build

# Builds dist\Odysseus\Odysseus.exe (PyInstaller, onedir) with the repo's own
# build-windows-portable.ps1 and publishes it as a zip artifact.
# Run it from the Actions tab ("Run workflow") or push a tag like v1.0.0-es.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Build portable exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build-windows-portable.ps1

      - name: Zip the portable folder
        shell: powershell
        run: Compress-Archive -Path dist\Odysseus -DestinationPath Odysseus-windows-portable.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Odysseus-windows-portable
          path: Odysseus-windows-portable.zip
          if-no-files-found: error
